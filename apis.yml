aid: ninjaone
name: NinjaOne
description: >-
  NinjaOne is a unified IT operations and endpoint management platform for
  enterprise IT teams and managed service providers (MSPs), combining remote
  monitoring and management (RMM), endpoint management, patch management, remote
  access, backup, mobile device management, IT asset management, vulnerability
  management, endpoint security, IT documentation, and ticketing in a single
  cloud-native platform. Founded in 2013 as NinjaRMM, the company manages over
  five million endpoints across 30,000+ customers. The NinjaOne Public API 2.0
  is an OAuth 2.0-secured REST API (client-credentials, authorization-code and
  refresh-token grants) that exposes organizations, devices, groups, queries,
  management actions, ticketing, users, locations, backup, custom fields,
  knowledge base, documents, checklists, vulnerability management, and webhooks
  for building integrations on top of the platform.
