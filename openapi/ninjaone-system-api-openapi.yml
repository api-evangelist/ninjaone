openapi: 3.0.1
info:
  title: NinjaOne Public API 2.0 Asset Tags system API
  description: NinjaOne Public API documentation.
  contact:
    email: api@ninjarmm.com
  version: 2.0.9-draft
security:
- oauth2:
  - monitoring
  - management
  - control
- sessionKey:
  - monitoring
  - management
  - control
tags:
- name: system
  description: Core system Entities and Resources
paths:
  /v2/contacts:
    get:
      tags:
      - system
      summary: Contact list
      description: Get all contacts
      operationId: getContacts
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '403':
          description: Forbidden
  /v2/contact/{id}:
    get:
      tags:
      - system
      summary: Contact details
      description: Get a contact by their ID
      operationId: getContactById
      parameters:
      - name: id
        in: path
        description: Contact identifier
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          description: Contact not found
        '403':
          description: Forbidden
        '401':
          description: Unauthorized
  /v2/organizations:
    get:
      tags:
      - system
      summary: List organizations
      description: Returns list of organizations (Brief mode)
      operationId: getOrganizations
      parameters:
      - name: pageSize
        in: query
        description: Limit number of organizations to return
        schema:
          type: integer
          format: int32
      - name: after
        in: query
        description: Last Organization Identifier from previous page
        schema:
          type: integer
          format: int32
      - name: of
        in: query
        description: Organization filter
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
  /v2/policies:
    get:
      tags:
      - system
      summary: List policies
      description: Returns list of policies
      operationId: getPolicies
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
  /v2/jobs:
    get:
      tags:
      - system
      summary: List active jobs
      description: Returns list of running jobs
      operationId: getActiveJobs
      parameters:
      - name: jobType
        in: query
        description: Job Type filter
        schema:
          type: string
      - name: df
        in: query
        description: Device filter
        schema:
          type: string
      - name: lang
        in: query
        description: Language tag
        schema:
          type: string
      - name: tz
        in: query
        description: Time Zone
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
  /v2/activities:
    get:
      tags:
      - system
      summary: List activities
      description: Returns activity log in reverse chronological order
      operationId: getActivities
      parameters:
      - name: class
        in: query
        description: Activity Class (System/Device) filter
        schema:
          type: string
          default: ALL
          enum:
          - SYSTEM
          - DEVICE
          - USER
          - ALL
      - name: before
        in: query
        description: Return activities recorded prior to specified date
        schema:
          type: string
      - name: after
        in: query
        description: Return activities recorded after to specified date
        schema:
          type: string
      - name: olderThan
        in: query
        description: Return activities recorded that are newer than specified activity ID
        schema:
          type: integer
          format: int64
      - name: newerThan
        in: query
        description: Return activities recorded that are older than specified activity ID
        schema:
          type: integer
          format: int64
      - name: type
        in: query
        description: Return activities of type
        schema:
          type: string
      - name: status
        in: query
        description: Return activities with status(es)
        schema:
          type: string
      - name: user
        in: query
        description: Return activities for user(s)
        schema:
          type: string
      - name: seriesUid
        in: query
        description: Return activities related to alert (series)
        schema:
          type: string
      - name: df
        in: query
        description: Device filter
        schema:
          type: string
      - name: pageSize
        in: query
        description: Limit number of activities to return
        schema:
          maximum: 1000
          minimum: 10
          type: integer
          format: int32
          default: 200
      - name: lang
        in: query
        description: Language tag
        schema:
          type: string
      - name: tz
        in: query
        description: Time Zone
        schema:
          type: string
      - name: sourceConfigUid
        in: query
        description: Allows users to make a request directed to a specific script
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitiesResponse'
  /v2/alerts:
    get:
      tags:
      - system
      summary: List active alerts (triggered conditions)
      description: Returns list of active alerts/triggered conditions
      operationId: getAlerts
      parameters:
      - name: sourceType
        in: query
        schema:
          type: string
          description: Alert Source filter
      - name: df
        in: query
        description: Device filter
        schema:
          type: string
      - name: lang
        in: query
        description: Language tag
        schema:
          type: string
      - name: tz
        in: query
        description: Time Zone
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
  /v2/automation/scripts:
    get:
      tags:
      - system
      summary: List all available automation scripts
      description: Returns list of all available automation scripts
      operationId: getAutomationScripts
      parameters:
      - name: lang
        in: query
        description: Language
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutomationScript'
  /v2/device-custom-fields:
    get:
      tags:
      - system
      summary: Device Custom Fields
      description: Returns list of all custom fields
      operationId: getDeviceGlobalCustomFields
      parameters:
      - name: scopes
        in: query
        description: Comma-separated list of scopes
        schema:
          type: string
          enum:
          - all,node,location,organization
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttributePublicApiDTO'
  /v2/devices:
    get:
      tags:
      - system
      summary: List devices
      description: Returns list of devices (basic node information)
      operationId: getDevices
      parameters:
      - name: df
        in: query
        description: Device filter
        schema:
          type: string
      - name: pageSize
        in: query
        description: Limit number of devices to return
        schema:
          type: integer
          format: int32
      - name: after
        in: query
        description: Last Node ID from previous page
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeWithDetailedReferences'
  /v2/devices-detailed:
    get:
      tags:
      - system
      summary: List devices (detailed)
      description: Returns list of devices with additional information
      operationId: getDevicesDetailed
      parameters:
      - name: df
        in: query
        description: Device filter
        schema:
          type: string
      - name: pageSize
        in: query
        schema:
          type: integer
          description: Limit number of devices to return
          format: int32
      - name: after
        in: query
        schema:
          type: integer
          description: Last Node ID from previous page
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
  /v2/notification-channels/enabled:
    get:
      tags:
      - system
      summary: List enabled notification channels
      description: Returns list of enabled notification channels
      operationId: getEnabledNotificationChannels
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationChannel'
  /v2/groups:
    get:
      tags:
      - system
      summary: List groups (saved searches)
      description: Returns list of groups
      operationId: getGroups
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
  /v2/locations:
    get:
      tags:
      - system
      summary: List locations
      description: Returns flat list of all locations for all organizations
      operationId: getLocations
      parameters:
      - name: pageSize
        in: query
        description: Limit number of locations to return
        schema:
          type: integer
          format: int32
      - name: after
        in: query
        description: Last Location Identifier from previous page
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationWithOrganizationRef'
  /v2/roles:
    get:
      tags:
      - system
      summary: List device roles
      description: Returns list of device roles
      operationId: getNodeRoles
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeRole'
  /v2/notification-channels:
    get:
      tags:
      - system
      summary: List notification channels
      description: Returns list of notification channels
      operationId: getNotificationChannels
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationChannel'
  /v2/organizations-detailed:
    get:
      tags:
      - system
      summary: List organizations (Detailed)
      description: Returns list of organizations with locations and policy mappings
      operationId: getOrganizationsDetailed
      parameters:
      - name: pageSize
        in: query
        description: Limit number of organizations to return
        schema:
          type: integer
          format: int32
      - name: after
        in: query
        description: Last Organization Identifier from previous page
        schema:
          type: integer
          format: int32
      - name: of
        in: query
        description: Organization filter
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationDetailed'
  /v2/tasks:
    get:
      tags:
      - system
      summary: List scheduled tasks
      description: Returns list of registered scheduled tasks
      operationId: getScheduledTasks
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledTask'
  /v2/software-products:
    get:
      tags:
      - system
      summary: List supported 3rd party software
      description: Returns available software products (3rd party patching)
      operationId: getSoftwareProducts
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SoftwareProduct'
  /v2/users:
    get:
      tags:
      - system
      summary: List users
      description: Returns list of users
      operationId: getUsers
      parameters:
      - name: userType
        in: query
        description: User type filter
        schema:
          type: string
          enum:
          - TECHNICIAN
          - END_USER
      - name: includeRoles
        in: query
        description: Includes user role information
        schema:
          type: boolean
          default: false
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /v2/devices/search:
    get:
      tags:
      - system
      summary: Find devices
      description: Returns list of entities matching search term
      operationId: search
      parameters:
      - name: q
        in: query
        description: Search query (name, logged on user name, IP address, etc.)
        schema:
          type: string
      - name: limit
        in: query
        description: Limit number of devices to return
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSearchResults'
  /v2/user/end-users:
    get:
      tags:
      - system
      summary: End user list
      description: Get all end users
      operationId: getEndUsers_1
      responses:
        '200':
          description: End user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EndUser'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /v2/user/technicians:
    get:
      tags:
      - system
      summary: Technicians list
      description: Get all technicians
      operationId: getTechnicians
      responses:
        '200':
          description: Technician
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Technician'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /v2/user/roles:
    get:
      tags:
      - system
      summary: Get user roles
      description: Get list of user roles
      operationId: getUserRoles
      parameters:
      - name: roleType
        in: query
        description: User role type filter
        schema:
          type: string
          enum:
          - TECHNICIAN
          - END_USER
      responses:
        '200':
          description: User roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRole'
        '401':
          description: Unauthorized
components:
  schemas:
    AttributeContentValue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
        system:
          type: boolean
    DeviceSearchMatch:
      type: object
      properties:
        id:
          type: integer
          description: Node (Device) identifier
          format: int32
        uid:
          type: string
          description: Node (Device) UUID
          format: uuid
        assignedOwnerUid:
          type: string
          description: Node (Device) Owner UUID
          format: uuid
        parentDeviceId:
          type: integer
          description: Parent Node identifier
          format: int32
        organizationId:
          type: integer
          description: Organization identifier
          format: int32
        locationId:
          type: integer
          description: Location identifier
          format: int32
        nodeClass:
          type: string
          description: Node Class
          enum:
          - WINDOWS_SERVER
          - WINDOWS_WORKSTATION
          - LINUX_WORKSTATION
          - MAC
          - ANDROID
          - APPLE_IOS
          - APPLE_IPADOS
          - VMWARE_VM_HOST
          - VMWARE_VM_GUEST
          - HYPERV_VMM_HOST
          - HYPERV_VMM_GUEST
          - LINUX_SERVER
          - MAC_SERVER
          - CLOUD_MONITOR_TARGET
          - NMS_SWITCH
          - NMS_ROUTER
          - NMS_FIREWALL
          - NMS_PRIVATE_NETWORK_GATEWAY
          - NMS_PRINTER
          - NMS_SCANNER
          - NMS_DIAL_MANAGER
          - NMS_WAP
          - NMS_IPSLA
          - NMS_COMPUTER
          - NMS_VM_HOST
          - NMS_APPLIANCE
          - NMS_OTHER
          - NMS_SERVER
          - NMS_PHONE
          - NMS_VIRTUAL_MACHINE
          - NMS_NETWORK_MANAGEMENT_AGENT
          - UNMANAGED_DEVICE
          - MANAGED_DEVICE
        nodeRoleId:
          type: integer
          description: Node Role identifier
          format: int32
        rolePolicyId:
          type: integer
          description: Node Role policy ID based on organization and location Policy Mapping
          format: int32
        policyId:
          type: integer
          description: Assigned policy ID (overrides organization and location policy mapping)
          format: int32
        approvalStatus:
          type: string
          description: Approval Status
          enum:
          - PENDING
          - APPROVED
        offline:
          type: boolean
          description: Is Offline?
        displayName:
          type: string
          description: Display Name
        systemName:
          type: string
          description: System Name
        dnsName:
          type: string
          description: DNS Name
        netbiosName:
          type: string
          description: NETBIOS Name
        created:
          type: number
          description: Created
          format: double
        lastContact:
          type: number
          description: Last Contact
          format: double
        lastUpdate:
          type: number
          description: Last data submission timestamp
          format: double
        userData:
          type: object
          additionalProperties: true
          description: Custom attributes
        tags:
          type: array
          description: Tags
          items:
            type: string
            description: Tags
        fields:
          type: object
          additionalProperties:
            type: object
            description: Custom Fields
          description: Custom Fields
        maintenance:
          $ref: '#/components/schemas/Maintenance'
        references:
          $ref: '#/components/schemas/NodeReferences'
        score:
          type: integer
          description: Match score
          format: int32
        matchAttr:
          type: string
          description: Name of the attribute that matched the query
        matchAttrValue:
          type: string
          description: Value of that attribute that matched
      description: Devices matching search query
    Activity:
      type: object
      properties:
        id:
          type: integer
          description: Activity identifier
          format: int64
        activityTime:
          type: number
          description: Activity timestamp
          format: double
        deviceId:
          type: integer
          description: Device identifier
          format: int32
        severity:
          type: string
          description: Severity
          enum:
          - NONE
          - MINOR
          - MODERATE
          - MAJOR
          - CRITICAL
        priority:
          type: string
          description: Priority
          enum:
          - NONE
          - LOW
          - MEDIUM
          - HIGH
        seriesUid:
          type: string
          description: Activity series UID (job/condition UID)
          format: uuid
        activityType:
          type: string
          description: Activity type code
          enum:
          - ACTIONSET
          - ACTION
          - CONDITION
          - CONDITION_ACTIONSET
          - CONDITION_ACTION
          - ANTIVIRUS
          - PATCH_MANAGEMENT
          - TEAMVIEWER
          - MONITOR
          - SYSTEM
          - COMMENT
          - SHADOWPROTECT
          - IMAGEMANAGER
          - HELP_REQUEST
          - SOFTWARE_PATCH_MANAGEMENT
          - SPLASHTOP
          - CLOUDBERRY
          - CLOUDBERRY_BACKUP
          - SCHEDULED_TASK
          - RDP
          - SCRIPTING
          - SECURITY
          - REMOTE_TOOLS
          - VIRTUALIZATION
          - PSA
          - MDM
          - NINJA_REMOTE
          - NINJA_QUICK_CONNECT
          - NINJA_NETWORK_DISCOVERY
          - NINJA_BACKUP
          - NINJA_TICKETING
          - KNOWLEDGE_BASE
          - RELATED_ITEM
          - CLIENT_CHECKLIST
          - CHECKLIST_TEMPLATE
          - DOCUMENTATION
          - MICROSOFT_INTUNE
        statusCode:
          type: string
          description: Activity status code
          enum:
          - START_REQUESTED
          - STARTED
          - IN_PROCESS
          - COMPLETED
          - CANCEL_REQUESTED
          - CANCELLED
          - BLOCKED
          - TRIGGERED
          - RESET
          - ACKNOWLEDGED
          - DISABLED
          - EVALUATION_FAILURE
          - CLIENT_CREATED
          - CLIENT_UPDATED
          - CLIENT_DELETED
          - CREDENTIAL_CREATED
          - CREDENTIAL_UPDATED
          - CREDENTIAL_DELETED
          - LOCATION_CREATED
          - LOCATION_UPDATED
          - LOCATION_DELETED
          - POLICY_CREATED
          - POLICY_UPDATED
          - POLICY_DELETED
          - NODE_CREATED
          - NODE_UPDATED
          - NODE_DELETED
          - NODE_RE_ENROLLED
          - NODE_ACCESS_GRANTED
          - NODE_ACCESS_DENIED
          - NODE_REGISTRATION_REJECTED
          - NODE_IDENTIFICATION_UPDATED
          - NODE_CLONING_DETECTED
          - NODE_CLONE_ADVISED_TO_REGISTER
          - NODE_MANUALLY_APPROVED
          - NODE_AUTOMATICALLY_APPROVED
          - NODE_MANUALLY_REJECTED
          - NODE_AUTOMATICALLY_REJECTED
          - REJECTED_NODE_CLEARED
          - REJECTED_NODE_DELETED
          - MOBILE_DEVICE_UNREGISTERED
          - APP_USER_CREATED
          - APP_USER_UPDATED
          - APP_USER_DELETED
          - APP_USER_LOGGED_IN
          - APP_USER_LOGGED_OUT
          - APP_USER_MFA_SETUP
          - APP_USER_MFA_DELETED
          - APP_USER_CRITICAL_ACTION
          - APP_USER_AUDIT_FAILED_LOGIN
          - END_USER_CREATED
          - END_USER_CREATED_API
          - END_USER_UPDATED
          - END_USER_UPDATED_API
          - END_USER_DELETED
          - END_USER_DELETED_API
          - END_USER_LOGGED_IN
          - END_USER_LOGGED_OUT
          - END_USER_MFA_SETUP
          - END_USER_MFA_DELETED
          - END_USER_AUDIT_FAILED_LOGIN
          - END_USER_CRITICAL_ACTION
          - CONTACT_CREATED
          - CONTACT_CREATED_API
          - CONTACT_UPDATED
          - CONTACT_UPDATED_API
          - CONTACT_DELETED
          - CONTACT_DELETED_API
          - DEVICE_GROUP_CREATED
          - DEVICE_GROUP_UPDATED
          - DEVICE_GROUP_DELETED
          - TICKET_TEMPLATE_CREATED
          - TICKET_TEMPLATE_UPDATED
          - TICKET_TEMPLATE_DELETED
          - CUSTOM_HEALTH_STATUS_CHANGED
          - CUSTOM_HEALTH_STATUS_RESET
          - PSA_TICKET_CREATION_FAILED
          - PSA_TICKET_CREATION_SUCCEEDED
          - RESET_BY_PSA_TICKET_CALLBACK
          - PSA_TICKET_CREATION_TEST
          - PSA_ENABLED
          - PSA_DISABLED
          - PSA_CREDENTIALS_FAILED
          - CONNECTWISE_AGREEMENTS_SYNC_COMPLETED
          - CONNECTWISE_AGREEMENTS_SYNC_STARTED
          - CONNECTWISE_NODE_SYNC_COMPLETED
          - CONNECTWISE_NODE_SYNC_STARTED
          - CONNECTWISE_NODE_SYNC_NODE_CREATED
          - CONNECTWISE_NODE_SYNC_NODE_UPDATED
          - CONNECTWISE_NODE_SYNC_NODE_DELETED
          - CONNECTWISE_UPDATED
          - CONNECTWISECONTROL_ATTEMPT
          - AUTOTASK_NODE_SYNC_STARTED
          - AUTOTASK_NODE_SYNC_COMPLETED
          - AUTOTASK_NODE_SYNC_NODE_CREATED
          - AUTOTASK_NODE_SYNC_NODE_UPDATED
          - AUTOTASK_NODE_SYNC_NODE_DELETED
          - AUTOTASK_UPDATED
          - AUTOTASK_ATTACHMENT_FAILURE
          - PSA_TICKET_UPDATED_FAILED
          - PSA_TICKET_UPDATED_SUCCEEDED
          - REPORT_CREATED
          - REPORT_UPDATED
          - REPORT_DELETED
          - TIME_ZONE_UPDATED
          - LANGUAGE_TAG_UPDATED
          - NODE_ROLE_CREATED
          - NODE_ROLE_UPDATED
          - NODE_ROLE_DELETED
          - COMMENT
          - VIPREAV_INSTALLED
          - VIPREAV_INSTALL_FAILED
          - VIPREAV_UNINSTALLED
          - VIPREAV_UNINSTALL_FAILED
          - VIPREAV_SCAN_THREAT_QUARANTINED
          - VIPREAV_ACTIVEPROTECTION_THREAT_QUARANTINED
          - VIPREAV_USERINITIATED_THREAT_QUARANTINED
          - VIPREAV_QUARANTINED_THREAT_REMOVED
          - VIPREAV_REBOOT_REQUIRED
