openapi: 3.0.1
info:
  title: NinjaOne Public API 2.0 Asset Tags devices API
  description: NinjaOne Public API documentation.
  contact:
    email: api@ninjarmm.com
  version: 2.0.9-draft
security:
- oauth2:
  - monitoring
  - management
  - control
- sessionKey:
  - monitoring
  - management
  - control
tags:
- name: devices
  description: Devices
paths:
  /v2/device/{id}:
    get:
      tags:
      - devices
      summary: Device details
      description: Returns device details
      operationId: getDevice
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Device information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /v2/device/{id}/jobs:
    get:
      tags:
      - devices
      summary: Device currently running (active) jobs
      description: Returns currently running jobs for device
      operationId: getDeviceActiveJobs
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: lang
        in: query
        schema:
          type: string
          description: Language tag
      - name: tz
        in: query
        description: Time Zone
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
  /v2/device/{id}/activities:
    get:
      tags:
      - devices
      summary: Device activities
      description: Returns activity log for device
      operationId: getDeviceActivities
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: olderThan
        in: query
        description: Return activities recorded that are newer than specified activity ID
        schema:
          type: integer
          format: int32
      - name: newerThan
        in: query
        description: Return activities recorded that are older than specified activity ID
        schema:
          type: integer
          format: int32
      - name: activityType
        in: query
        description: Return activities of type
        schema:
          type: string
      - name: status
        in: query
        description: Return activities with status(es)
        schema:
          type: string
      - name: seriesUid
        in: query
        description: Return activities related to alert (series)
        schema:
          type: string
      - name: pageSize
        in: query
        description: Limit number of activities to return
        schema:
          maximum: 1000
          minimum: 10
          type: integer
          format: int32
          default: 200
      - name: lang
        in: query
        description: Language tag
        schema:
          type: string
      - name: tz
        in: query
        description: Time Zone
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeActivitiesResponse'
  /v2/device/{id}/alerts:
    get:
      tags:
      - devices
      summary: Device alerts (triggered conditions)
      description: Returns list of active alerts (triggered conditions) for device
      operationId: getDeviceAlerts
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: lang
        in: query
        schema:
          type: string
          description: Language tag
      - name: tz
        in: query
        description: Time Zone
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
  /v2/device/{id}/disks:
    get:
      tags:
      - devices
      summary: Device disk drives
      description: Returns device disks' details
      operationId: getDeviceDiskDrives
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiskDrive'
  /v2/device/{id}/os-patch-installs:
    get:
      tags:
      - devices
      summary: OS Patch installation report for device
      description: Returns patch installation history records (successful and failed) for device
      operationId: getDeviceInstalledOSPatches
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        description: Patch Status filter (FAILED, INSTALLED)
        schema:
          type: string
      - name: installedBefore
        in: query
        description: Include patches installed before specified date
        schema:
          type: string
      - name: installedAfter
        in: query
        description: Include patches installed after specified date
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OSPatch'
  /v2/device/{id}/software-patch-installs:
    get:
      tags:
      - devices
      summary: Software Patch history for device
      description: Returns 3rd party software patch installation history records for device (successful and failed)
      operationId: getDeviceInstalledSoftwarePatches
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        description: Patch Type filter
        schema:
          type: string
      - name: impact
        in: query
        description: Patch Impact filter
        schema:
          type: string
      - name: status
        in: query
        description: Patch Status filter
        schema:
          type: string
      - name: productIdentifier
        in: query
        description: Product Identifier
        schema:
          type: string
      - name: installedBefore
        in: query
        description: Include patches installed before specified date
        schema:
          type: string
      - name: installedAfter
        in: query
        description: Include patches installed after specified date
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SoftwarePatch'
  /v2/device/{id}/last-logged-on-user:
    get:
      tags:
      - devices
      summary: Last logged-on user information
      description: Returns username that was last to login to device
      operationId: getDeviceLastLoggedOnUser
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOnUser'
      security:
      - oauth2:
        - monitoring
  /v2/device/{id}/network-interfaces:
    get:
      tags:
      - devices
      summary: Device network interfaces
      description: Returns device network interfaces' details
      operationId: getDeviceNetworkInterfaces
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkInterface'
  /v2/device/{id}/os-patches:
    get:
      tags:
      - devices
      summary: OS Patches
      description: Returns list of pending/rejected/approved OS patches for device
      operationId: getDevicePendingFailedRejectedOSPatches
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        description: Patch Status filter
        schema:
          type: string
      - name: type
        in: query
        description: Patch Type filter
        schema:
          type: string
      - name: severity
        in: query
        description: Patch Severity filter
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OSPatch'
  /v2/device/{id}/software-patches:
    get:
      tags:
      - devices
      summary: Pending, Failed and Rejected Software patches for device
      description: Returns list of 3rd party Software patches for a device (for which there were no installation attempts)
      operationId: getDevicePendingFailedRejectedSoftwarePatches
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        description: Patch Status filter
        schema:
          type: string
      - name: productIdentifier
        in: query
        description: Product Identifier
        schema:
          type: string
      - name: type
        in: query
        description: Patch Type filter
        schema:
          type: string
      - name: impact
        in: query
        description: Patch Impact filter
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SoftwarePatch'
  /v2/device/{id}/processors:
    get:
      tags:
      - devices
      summary: Device processors
      description: Returns list of device Processor details
      operationId: getDeviceProcessors
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Processor'
  /v2/device/{id}/windows-services:
    get:
      tags:
      - devices
      summary: Windows services
      description: Returns list of Windows Services and their statuses
      operationId: getDeviceServices
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: name
        in: query
        description: Service name
        schema:
          type: string
      - name: state
        in: query
        description: Service state
        schema:
          type: string
          enum:
          - UNKNOWN
          - STOPPED
          - START_PENDING
          - RUNNING
          - STOP_PENDING
          - PAUSE_PENDING
          - PAUSED
          - CONTINUE_PENDING
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WindowsService'
  /v2/device/{id}/software:
    get:
      tags:
      - devices
      summary: Device software inventory
      description: Returns list of software installed on device
      operationId: getDeviceSoftware
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
  /v2/device/{id}/volumes:
    get:
      tags:
      - devices
      summary: Device storage volumes
      description: Returns device volumes' details
      operationId: getDeviceVolumes
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: include
        in: query
        description: Additional information to include (bl - BitLocker status)
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Volume'
  /v2/device/{id}/custom-fields:
    get:
      tags:
      - devices
      summary: Device custom fields
      description: Returns list of device custom fields
      operationId: getNodeCustomFields
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: withInheritance
        in: query
        description: Retrieve values using definition scope hierarchy
        schema:
          type: boolean
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
    patch:
      tags:
      - devices
      summary: Update Field Values
      description: Update device custom field values
      operationId: updateNodeAttributeValues
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
      responses:
        default:
          description: default response
          content:
            '*/*': {}
  /v2/device/{id}/policy/overrides:
    get:
      tags:
      - devices
      summary: Get summary of device policy overrides
      description: Returns list of overridden policy sections
      operationId: getPolicyOverrides
      parameters:
      - name: id
        in: path
        description: Device identifier
        required: true
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyOverrides'
components:
  schemas:
    Processor:
      type: object
      properties:
        architecture:
          type: string
          description: Architecture
        maxClockSpeed:
          type: integer
          description: Max Clock Speed
          format: int64
        clockSpeed:
          type: integer
          description: Current Clock Speed
          format: int64
        name:
          type: string
          description: Name
        numCores:
          type: integer
          description: Number of Cores
          format: int32
        numLogicalCores:
          type: integer
          description: Number of Logical Cores]
          format: int32
      description: Processors
    Activity:
      type: object
      properties:
        id:
          type: integer
          description: Activity identifier
          format: int64
        activityTime:
          type: number
          description: Activity timestamp
          format: double
        deviceId:
          type: integer
          description: Device identifier
          format: int32
        severity:
          type: string
          description: Severity
          enum:
          - NONE
          - MINOR
          - MODERATE
          - MAJOR
          - CRITICAL
        priority:
          type: string
          description: Priority
          enum:
          - NONE
          - LOW
          - MEDIUM
          - HIGH
        seriesUid:
          type: string
          description: Activity series UID (job/condition UID)
          format: uuid
        activityType:
          type: string
          description: Activity type code
          enum:
          - ACTIONSET
          - ACTION
          - CONDITION
          - CONDITION_ACTIONSET
          - CONDITION_ACTION
          - ANTIVIRUS
          - PATCH_MANAGEMENT
          - TEAMVIEWER
          - MONITOR
