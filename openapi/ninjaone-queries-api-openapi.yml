      parameters:
      - name: cursor
        in: query
        description: Cursor name
        schema:
          type: string
      - name: pageSize
        in: query
        description: Limit number of records per page
        schema:
          maximum: 10000
          minimum: 10
          type: integer
          format: int32
          default: 1000
      - name: updatedAfter
        in: query
        description: Custom fields updated after specified date
        schema:
          type: string
      - name: fields
        in: query
        description: Comma-separated list of fields
        schema:
          type: string
      - name: scopes
        in: query
        description: Comma-separated list of scopes
        schema:
          type: string
          default: all
      - name: showSecureValues
        in: query
        description: Flag to indicate if secure values should be returned as plain text without encryption
