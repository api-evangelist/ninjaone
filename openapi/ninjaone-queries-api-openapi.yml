openapi: 3.0.1
info:
  title: NinjaOne Public API 2.0 Asset Tags queries API
  description: NinjaOne Public API documentation.
  contact:
    email: api@ninjarmm.com
  version: 2.0.9-draft
security:
- oauth2:
  - monitoring
  - management
  - control
- sessionKey:
  - monitoring
  - management
  - control
tags:
- name: queries
  description: Queries
paths:
  /v2/queries/antivirus-status:
    get:
      tags:
      - queries
      summary: Antivirus status report
      description: Returns list of statues of antivirus software installed on devices
      operationId: getAntivirusStatusReport
      parameters:
      - name: df
        in: query
        description: Device filter
        schema:
          type: string
      - name: ts
        in: query
        description: Monitoring timestamp filter
        schema:
          type: string
      - name: productState
        in: query
        description: Product State filter
        schema:
          type: string
      - name: productName
        in: query
        description: Product Name filter
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor name
        schema:
          type: string
      - name: pageSize
        in: query
        description: Limit number of records per page
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AntivirusStatusReport'
  /v2/queries/antivirus-threats:
    get:
      tags:
      - queries
      summary: Antivirus threats report
      description: Returns list of antivirus threats
      operationId: getAntivirusThreats
      parameters:
      - name: df
        in: query
        description: Device filter
        schema:
          type: string
      - name: ts
        in: query
        description: Monitoring timestamp filter
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor name
        schema:
          type: string
      - name: pageSize
        in: query
        description: Limit number of records per page
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AntivirusThreatsReport'
  /v2/queries/computer-systems:
    get:
      tags:
      - queries
      summary: Computer systems report
      description: Returns computer systems information for devices
      operationId: getComputerSystems
      parameters:
      - name: df
        in: query
        description: Device filter
        schema:
          type: string
      - name: ts
        in: query
        description: Monitoring timestamp filter
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor name
